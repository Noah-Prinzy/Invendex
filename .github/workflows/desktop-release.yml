name: Desktop Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  HUSKY: 0

jobs:
  windows-installer:
    name: Windows Installer Release
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install backend dependencies
        run: npm --prefix backend ci

      - name: Install frontend dependencies
        run: npm --prefix frontend ci

      - name: Resolve desktop release version
        id: release
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          TAG="v$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Validate pushed tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          if [ "${GITHUB_REF_NAME}" != "${{ steps.release.outputs.tag }}" ]; then
            echo "Expected tag ${{ steps.release.outputs.tag }} from package.json, but received ${GITHUB_REF_NAME}."
            exit 1
          fi

      - name: Build desktop installer
        run: npm run desktop:build

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-release-${{ steps.release.outputs.version }}
          path: |
            desktop-dist/Invendex-Setup-${{ steps.release.outputs.version }}.exe
            desktop-dist/Invendex-Setup-${{ steps.release.outputs.version }}.exe.blockmap
            desktop-dist/latest.yml
          if-no-files-found: error
          retention-days: 14

      - name: Create or update GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.release.outputs.tag }}"
          TITLE="Invendex ${{ steps.release.outputs.version }}"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$TITLE" --latest
          else
            gh release create "$TAG" \
              --title "$TITLE" \
              --target "${GITHUB_SHA}" \
              --generate-notes \
              --latest
          fi

          gh release upload "$TAG" \
            "desktop-dist/Invendex-Setup-${{ steps.release.outputs.version }}.exe" \
            "desktop-dist/Invendex-Setup-${{ steps.release.outputs.version }}.exe.blockmap" \
            "desktop-dist/latest.yml" \
            --clobber
