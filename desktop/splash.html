<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Invendex</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #071120;
        --bg-soft: #0b1b34;
        --surface: rgba(11, 24, 45, 0.92);
        --border: rgba(167, 214, 255, 0.2);
        --text: #f4f8ff;
        --muted: rgba(219, 232, 255, 0.76);
        --accent-a: #3adfff;
        --accent-b: #2e79ff;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
        background: var(--bg);
        font-family: "Segoe UI", system-ui, sans-serif;
      }

      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        overflow: hidden;
        background:
          radial-gradient(circle at 18% 24%, rgba(58, 223, 255, 0.18) 0%, rgba(58, 223, 255, 0) 34%),
          radial-gradient(circle at 82% 14%, rgba(46, 121, 255, 0.2) 0%, rgba(46, 121, 255, 0) 36%),
          linear-gradient(180deg, #081223 0%, #071120 100%);
      }

      .splash-stage {
        position: relative;
        width: min(100vw, 460px);
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        isolation: isolate;
      }

      .splash-orb,
      .splash-grid {
        position: absolute;
        pointer-events: none;
      }

      .splash-orb {
        border-radius: 999px;
        filter: blur(14px);
        opacity: 0.9;
      }

      .splash-orb-a {
        width: 240px;
        height: 240px;
        top: 42px;
        left: -50px;
        background: radial-gradient(circle, rgba(58, 223, 255, 0.4) 0%, rgba(58, 223, 255, 0) 70%);
        animation: float-a 6s ease-in-out infinite;
      }

      .splash-orb-b {
        width: 220px;
        height: 220px;
        right: -36px;
        bottom: 32px;
        background: radial-gradient(circle, rgba(46, 121, 255, 0.34) 0%, rgba(46, 121, 255, 0) 70%);
        animation: float-b 7.2s ease-in-out infinite;
      }

      .splash-grid {
        inset: 18px;
        background-image:
          linear-gradient(rgba(167, 214, 255, 0.08) 1px, transparent 1px),
          linear-gradient(90deg, rgba(167, 214, 255, 0.08) 1px, transparent 1px);
        background-size: 34px 34px;
        mask-image: radial-gradient(circle at center, rgba(0, 0, 0, 0.95) 30%, rgba(0, 0, 0, 0.14) 82%, transparent 100%);
        opacity: 0.55;
        animation: grid-drift 16s linear infinite;
      }

      .splash-card {
        position: relative;
        z-index: 1;
        width: min(100%, 356px);
        display: grid;
        justify-items: center;
        gap: 18px;
        padding: 34px 28px 30px;
        background:
          linear-gradient(145deg, var(--surface) 0%, rgba(8, 17, 31, 0.98) 100%);
        border: 1px solid var(--border);
        clip-path: polygon(0 18px, 18px 0, calc(100% - 54px) 0, 100% 18px, 100% calc(100% - 18px), calc(100% - 18px) 100%, 54px 100%, 0 calc(100% - 18px));
        box-shadow:
          0 28px 68px rgba(2, 8, 19, 0.58),
          inset 0 0 0 1px rgba(188, 226, 255, 0.06);
        text-align: center;
      }

      .logo-shell {
        position: relative;
        width: 156px;
        aspect-ratio: 1;
        display: grid;
        place-items: center;
      }

      .logo-ring {
        position: absolute;
        inset: 0;
        border-radius: 999px;
        border: 1px solid rgba(169, 223, 255, 0.16);
      }

      .logo-ring-a {
        animation: ring-pulse 2.8s ease-in-out infinite;
      }

      .logo-ring-b {
        inset: 14px;
        border-color: rgba(58, 223, 255, 0.2);
        animation: ring-pulse 2.8s ease-in-out infinite 0.45s;
      }

      .logo-image {
        width: 100%;
        height: auto;
        filter: drop-shadow(0 18px 30px rgba(2, 10, 26, 0.34));
        animation: logo-float 2.7s ease-in-out infinite;
      }

      .splash-eyebrow {
        margin: 0;
        color: rgba(195, 231, 255, 0.78);
        font-size: 0.72rem;
        font-weight: 800;
        letter-spacing: 0.24em;
        text-transform: uppercase;
      }

      .splash-title {
        margin: 0;
        color: var(--text);
        font-size: 2rem;
        line-height: 1;
        letter-spacing: -0.03em;
      }

      .splash-copy {
        margin: 0;
        color: var(--muted);
        font-size: 0.95rem;
        line-height: 1.65;
        max-width: 24ch;
      }

      .splash-loader {
        width: 180px;
        height: 4px;
        background: rgba(185, 222, 255, 0.1);
        border-radius: 999px;
        overflow: hidden;
      }

      .splash-loader-bar {
        display: block;
        width: 40%;
        height: 100%;
        border-radius: inherit;
        background: linear-gradient(90deg, var(--accent-b) 0%, var(--accent-a) 100%);
        animation: loader-shift 1.8s ease-in-out infinite;
      }

      @keyframes logo-float {
        0%,
        100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-7px);
        }
      }

      @keyframes ring-pulse {
        0%,
        100% {
          opacity: 0.28;
          transform: scale(0.96);
        }
        50% {
          opacity: 0.88;
          transform: scale(1.04);
        }
      }

      @keyframes loader-shift {
        0% {
          transform: translateX(-120%);
        }
        50% {
          transform: translateX(150%);
        }
        100% {
          transform: translateX(260%);
        }
      }

      @keyframes grid-drift {
        0% {
          background-position: 0 0, 0 0;
        }
        100% {
          background-position: 34px 18px, 34px 18px;
        }
      }

      @keyframes float-a {
        0%,
        100% {
          transform: translate3d(0, 0, 0) scale(1);
        }
        50% {
          transform: translate3d(14px, 10px, 0) scale(1.05);
        }
      }

      @keyframes float-b {
        0%,
        100% {
          transform: translate3d(0, 0, 0) scale(1);
        }
        50% {
          transform: translate3d(-12px, -8px, 0) scale(1.04);
        }
      }
    </style>
  </head>
  <body>
    <main class="splash-stage" aria-label="Invendex splash screen">
      <span class="splash-orb splash-orb-a" aria-hidden="true"></span>
      <span class="splash-orb splash-orb-b" aria-hidden="true"></span>
      <span class="splash-grid" aria-hidden="true"></span>
      <section class="splash-card">
        <div class="logo-shell" aria-hidden="true">
          <span class="logo-ring logo-ring-a"></span>
          <span class="logo-ring logo-ring-b"></span>
          <img id="logo-image" class="logo-image" alt="" />
        </div>
        <p class="splash-eyebrow">Invendex Desktop</p>
        <h1 class="splash-title">Preparing your workspace</h1>
        <p class="splash-copy">
          Starting local services and opening your inventory workspace.
        </p>
        <div class="splash-loader" aria-hidden="true">
          <span class="splash-loader-bar"></span>
        </div>
      </section>
    </main>
    <script>
      const params = new URLSearchParams(window.location.search);
      const logoPath = params.get('logoPath');
      const logoImage = document.getElementById('logo-image');

      if (logoPath) {
        logoImage.src = logoPath;
      }
    </script>
  </body>
</html>
